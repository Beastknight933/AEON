[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-ml"
version = "1.1.0"
description = "AEON procurement quote recommendation ML engine for FastAPI backend"
authors = [{ name = "AEON ML Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["aeon_ml*"]

[tool.setuptools.package-data]
"aeon_ml.models" = ["artifacts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

