services:
  - type: web
    name: aeon-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install ./ml-module"
    startCommand: "bash scripts/start.sh"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://aeon-control.vercel.app,http://localhost:3000"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ML_PROVIDER_TYPE
        value: mock
      - key: ML_MODULE_PATH
        value: aeon_ml
